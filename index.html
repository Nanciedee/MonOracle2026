        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.4; animation: moveStar linear infinite; }
        @keyframes moveStar { from { transform: translateY(0px); } to { transform: translateY(-1000px); } }
        
        #app { width: 95%; max-width: 1100px; text-align: center; padding: 40px 0; }
        h1 { color: var(--gold); letter-spacing: 5px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.6); }

        #loader { display: none; padding: 100px 20px; }
        .spiral { width: 80px; height: 80px; border: 4px solid var(--gold); border-top: 4px solid transparent; border-radius: 50%; animation: spin 1.5s linear infinite; margin: 0 auto 30px; }

        #loading-msg { font-style: italic; font-size: 1.5rem; color: var(--gold); text-shadow: 0 0 10px var(--gold); }

        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin-top: 30px; justify-content: center; }
        .fiche { background: rgba(0,0,0,0.85); border: 1px solid var(--gold); border-radius: 20px; padding: 25px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }

function startAmbiance() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (ambianceOsc) return; 

        // Création d'une nappe plus riche (Basse profonde + Harmonique)
        const createDrone = (freq, vol) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle'; // Son beaucoup plus doux que 'sine'
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 3); // Montée très lente
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            return osc;
        };

        // On joue deux fréquences qui s'entremêlent
        ambianceOsc = createDrone(68.05, 0.03); // Une octave en dessous de l'OM (Ancrage)
        ambianceOsc2 = createDrone(136.1, 0.02); // Fréquence OM (Cœur)
    }
