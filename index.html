<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Vibratoire 2026</title>
    <style>
        :root {
            --gold: #d4af37;
            --mystic-blue: #0f172a;
            --glass: rgba(255, 255, 255, 0.08);
            --text: #e2e8f0;
        }

        body {
            background: #000;
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- FOND ÉTOILÉ --- */
        #star-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.4;
            animation: moveStar linear infinite;
        }

        @keyframes moveStar {
            from { transform: translateY(0px); }
            to { transform: translateY(-1000px); }
        }

        /* --- INTERFACE --- */
        #app { width: 90%; max-width: 1200px; text-align: center; padding: 40px 0; }
        
        h1 { 
            color: var(--gold); 
            letter-spacing: 5px; 
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            margin-bottom: 20px;
        }

        .meteo-box {
            background: var(--glass);
            border: 1px solid var(--gold);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .intention-box { margin-bottom: 30px; }

        input[type="text"] {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--gold);
            color: white;
            padding: 15px;
            width: 80%;
            max-width: 500px;
            border-radius: 30px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }

        .btn-main {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 18px 45px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.5s;
        }

        .btn-main:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 40px var(--gold);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(5px);
        }

        .card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .btn-vibration {
            background: var(--gold);
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        .porte-title {
            grid-column: 1 / -1;
            color: var(--gold);
            font-size: 2.2rem;
            margin-top: 60px;
            letter-spacing: 3px;
        }

        .intention-rappel {
            grid-column: 1 / -1;
            font-style: italic;
            color: var(--gold);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div id="star-container"></div>

<div id="app">
    <h1>✨ ORACLE VIBRATOIRE 2026 ✨</h1>

    <div id="meteo" class="meteo-box">
        Synchronisation avec les éphémérides célestes...
    </div>

    <div class="intention-box">
        <input type="text" id="userIntention" placeholder="Quelle est votre intention sacrée ?">
    </div>

    <button class="btn-main" onclick="tirageRituel()">🔮 RECEVOIR LA GUIDANCE</button>

    <div id="display" class="cards-grid"></div>
</div>

<script>
    // --- CONFIGURATION DES ÉTOILES ---
    function initStars() {
        const container = document.getElementById('star-container');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 30 + 20) + 's';
            container.appendChild(star);
        }
    }
    initStars();

    // --- BASE DE DONNÉES AVEC TES NOMS DE FICHIERS EXACTS ---
    const archanges = {
        "Michaël": { freq: "528Hz", pierres: "Lapis-lazuli", astre: "Soleil", img: "img/Michael.png" },
        "Raphaël": { freq: "639Hz", pierres: "Malachite", astre: "Mercure", img: "img/Raphael.png" },
        "Gabriel": { freq: "741Hz", pierres: "Pierre de lune", astre: "Lune", img: "img/Gabriel.png" },
        "Uriel": { freq: "852Hz", pierres: "Ambre", astre: "Uranus", img: "img/Uriel.png" },
        "Chamuel": { freq: "639Hz", pierres: "Quartz Rose", astre: "Vénus", img: "img/Chamuel.png" },
        "Jophiel": { freq: "963Hz", pierres: "Topaze dorée", astre: "Jupiter", img: "img/Jophiel.png" },
        "Zadkiel": { freq: "432Hz", pierres: "Améthyste", astre: "Saturne", img: "img/Zadkiel.png" },
        "Haniel": { freq: "417Hz", pierres: "Sélénite", astre: "Lune", img: "img/Haniel.png" },
        "Raziel": { freq: "888Hz", pierres: "Cristal de roche", astre: "Uranus", img: "img/Raziel.png" },
        "Azraël": { freq: "396Hz", pierres: "Rose des sables", astre: "Pluton", img: "img/Azraël_2.png" },
        "Sandalphon": { freq: "285Hz", pierres: "Turquoise", astre: "Terre", img: "img/Sandalphon.png" },
        "Métatron": { freq: "999Hz", pierres: "Platine", astre: "Cosmos", img: "img/Métatron.png" }
    };

    const chakras = [
        { nom: "Racine", freq: "396Hz", msg: "Stabilité", color: "#ff4d4d", img: "img/Chakra 1 Racine.png" },
        { nom: "Sacré", freq: "417Hz", msg: "Créativité", color: "#ffa366", img: "img/Chakra 2 Sacré.png" },
        { nom: "Plexus Solaire", freq: "528Hz", msg: "Force", color: "#ffff66", img: "img/Chakra 3 Plexus Solaire.png" },
        { nom: "Coeur", freq: "639Hz", msg: "Amour", color: "#66ff66", img: "img/Chakra 4 Coeur.png" },
        { nom: "Gorge", freq: "741Hz", msg: "Vérité", color: "#66ffff", img: "img/Chakra 5 Gorge.png" },
        { nom: "Troisieme Oeil", freq: "852Hz", msg: "Vision", color: "#6666ff", img: "img/Chakra 6 Troisieme Oeil.png" },
        { nom: "Couronne", freq: "963Hz", msg: "Unité", color: "#a366ff", img: "img/Chakra 7 Couronne.png" }
    ];

    const portes = {
        "protection": { titre: "Protection", freq: 417, img: "img/Vibratoire Protection.png", invoc: "Je suis entouré(e) d’un cercle de lumière." },
        "guerison": { titre: "Guérison", freq: 528, img: "img/Vibratoire Guérison.png", invoc: "Je suis un temple vivant." },
        "guidance": { titre: "Guidance", freq: 852, img: "img/Vibratoire Guide.png", invoc: "Je suis prêt(e) à recevoir les signes." },
        "amour": { titre: "Amour", freq: 639, img: "img/Vibratoire Amour.png", invoc: "Je suis amour, je suis lien, je suis unité." },
        "sagesse": { titre: "Sagesse", freq: 963, img: "img/Vibratoire Sagesse.png", invoc: "Je suis un canal vivant de vérité." }
    };

    // --- LOGIQUE AUDIO ---
    let audioCtx = null;
    function playTone(freq) {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 4);
    }

    // --- TIRAGE ---
    function tirageRituel() {
        const intention = document.getElementById('userIntention').value;
        const display = document.getElementById('display');
        
        const arcNames = Object.keys(archanges);
        const arc = archanges[arcNames[Math.floor(Math.random() * arcNames.length)]];
        const cha = chakras[Math.floor(Math.random() * chakras.length)];
        const pKeys = Object.keys(portes);
        const porte = portes[pKeys[Math.floor(Math.random() * pKeys.length)]];

        display.innerHTML = `
            ${intention ? `<div class="intention-rappel">Intention : "${intention}"</div>` : ''}

            <div class="card">
                <h3>Archange</h3>
                <img src="${arc.img}" alt="Archange">
                <p><strong>Astre :</strong> ${arc.astre}</p>
                <p><strong>Vibration :</strong> ${arc.freq}</p>
            </div>

            <div class="card">
                <h3 style="color:${cha.color}">Chakra ${cha.nom}</h3>
                <img src="${cha.img}" alt="Chakra">
                <p><strong>Vibration :</strong> ${cha.freq}</p>
                <p>${cha.msg}</p>
            </div>

            <div class="porte-title">🚪 Scellement Vibratoire</div>

            <div class="card" style="grid-column: 1 / -1; max-width: 500px; margin: 20px auto; border: 2px solid var(--gold);">
                <h2 style="color:var(--gold)">${porte.titre}</h2>
                <img src="${porte.img}" alt="Porte">
                <p><em>"${porte.invoc}"</em></p>
                <button class="btn-vibration" onclick="playTone(${porte.freq})">🔊 ACTIVER ${porte.freq}Hz</button>
            </div>
        `;
        window.scrollTo({ top: display.offsetTop - 50, behavior: 'smooth' });
    }

    window.onload = () => {
        const d = new Date().toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById('meteo').innerHTML = `<strong>${d}</strong><br>Vibration du jour : 528 Hz`;
    };
</script>
</body>
</html>
