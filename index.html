<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Vibratoire 2026</title>
    <style>
        :root {
            --gold: #d4af37;
            --mystic-blue: #0f172a;
            --glass: rgba(255, 255, 255, 0.07);
            --text: #e2e8f0;
        }

        body {
            background: #000;
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- EFFET ÉTOILES FILANTES --- */
        #star-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: moveStar linear infinite;
        }

        @keyframes moveStar {
            from { transform: translateY(0px); }
            to { transform: translateY(-1000px); }
        }

        /* --- INTERFACE --- */
        #app { width: 90%; max-width: 1200px; text-align: center; padding: 40px 0; }
        
        h1 { 
            color: var(--gold); 
            letter-spacing: 5px; 
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            margin-bottom: 10px;
        }

        .meteo-box {
            background: var(--glass);
            border: 1px solid var(--gold);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        .btn-main {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 18px 45px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.5s;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .btn-main:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 40px var(--gold);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 20px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            border-color: var(--gold);
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .card img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .btn-vibration {
            background: var(--gold);
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }

        .porte-title {
            grid-column: 1 / -1;
            color: var(--gold);
            font-size: 2rem;
            margin-top: 50px;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

<div id="star-container"></div>

<div id="app">
    <h1>✨ ORACLE VIBRATOIRE 2026 ✨</h1>

    <div id="meteo" class="meteo-box">
        Connexion aux astres en cours...
    </div>

    <button class="btn-main" onclick="tirageMystique()">🔮 RECEVOIR MA GUIDANCE</button>

    <div id="display" class="cards-grid"></div>
</div>

<script>
    // --- CRÉATION ÉTOILES ---
    function createStars() {
        const container = document.getElementById('star-container');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 50 + 50) + 's';
            star.style.animationDelay = (Math.random() * 50) + 's';
            container.appendChild(star);
        }
    }
    createStars();

    // --- DONNÉES ---
    const archanges = {
        "Michaël": { freq: "528Hz", pierres: "Lapis-lazuli", astre: "Soleil", img: "img/archanges/michael.jpg" },
        "Raphaël": { freq: "639Hz", pierres: "Malachite", astre: "Mercure", img: "img/archanges/raphael.jpg" },
        "Gabriel": { freq: "741Hz", pierres: "Pierre de lune", astre: "Lune", img: "img/archanges/gabriel.jpg" },
        "Uriel": { freq: "852Hz", pierres: "Ambre", astre: "Uranus", img: "img/archanges/uriel.jpg" },
        "Chamuel": { freq: "639Hz", pierres: "Quartz Rose", astre: "Vénus", img: "img/archanges/chamuel.jpg" },
        "Métatron": { freq: "999Hz", pierres: "Platine", astre: "Cosmos", img: "img/archanges/metatron.jpg" }
    };

    const chakras = [
        { nom: "Racine", freq: "396Hz", msg: "Stabilité & Ancrage", color: "#ff4d4d" },
        { nom: "Sacré", freq: "417Hz", msg: "Créativité & Fluidité", color: "#ffa366" },
        { nom: "Plexus", freq: "528Hz", msg: "Pouvoir & Affirmation", color: "#ffff66" },
        { nom: "Cœur", freq: "639Hz", msg: "Amour Inconditionnel", color: "#66ff66" },
        { nom: "Gorge", freq: "741Hz", msg: "Authenticité & Expression", color: "#66ffff" },
        { nom: "3e Œil", freq: "852Hz", msg: "Intuition & Vision", color: "#6666ff" },
        { nom: "Couronne", freq: "963Hz", msg: "Unité Cosmique", color: "#a366ff" }
    ];

    const portes = {
        "P1": { titre: "Protection", freq: 417, img: "img/Vibratoire Protection.png", invoc: "Je suis protégé(e)." },
        "P2": { titre: "Guérison", freq: 528, img: "img/Vibratoire Guérison.png", invoc: "Je suis régénéré(e)." },
        "P3": { titre: "Guidance", freq: 852, img: "img/Vibratoire Guide.png", invoc: "Je suis guidé(e)." },
        "P4": { titre: "Amour", freq: 639, img: "img/Vibratoire Amour.png", invoc: "Je suis aimé(e)." },
        "P5": { titre: "Sagesse", freq: 963, img: "img/Vibratoire Sagesse.png", invoc: "Je sais." }
    };

    // --- SON ---
    let audioCtx = null;
    function playFreq(f) {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 6);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 6);
    }

    // --- TIRAGE ---
    function tirageMystique() {
        const display = document.getElementById('display');
        
        const arcKey = Object.keys(archanges)[Math.floor(Math.random() * Object.keys(archanges).length)];
        const arc = archanges[arcKey];
        const cha = chakras[Math.floor(Math.random() * chakras.length)];
        const pKey = Object.keys(portes)[Math.floor(Math.random() * Object.keys(portes).length)];
        const porte = portes[pKey];

        display.innerHTML = `
            <div class="card">
                <h3>Archange ${arcKey}</h3>
                <img src="${arc.img}" onerror="this.src='https://via.placeholder.com/300x400/000/d4af37?text=${arcKey}'">
                <p>Astre : ${arc.astre} | ${arc.freq}</p>
                <small>Pierre : ${arc.pierres}</small>
            </div>

            <div class="card">
                <h3 style="color:${cha.color}">Chakra ${cha.nom}</h3>
                <div style="height:380px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(circle, ${cha.color}33, transparent);">
                    <h1 style="font-size:4rem; color:${cha.color}">🌀</h1>
                    <p style="font-weight:bold">${cha.freq}</p>
                </div>
                <p>${cha.msg}</p>
            </div>

            <div class="porte-title">🚪 Porte de Scellement Vibratoire</div>

            <div class="card" style="grid-column: 1 / -1; max-width: 400px; margin: 20px auto;">
                <h3>Porte de ${porte.titre}</h3>
                <img src="${porte.img}" onerror="this.src='https://via.placeholder.com/300x400/d4af37/000?text=${porte.titre}'">
                <p><em>"${porte.invoc}"</em></p>
                <button class="btn-vibration" onclick="playFreq(${porte.freq})">🔊 ACTIVER ${porte.freq}Hz</button>
            </div>
        `;
        
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // --- INIT ---
    window.onload = () => {
        document.getElementById('meteo').innerHTML = `
            <strong>Aujourd'hui, 24 Janvier 2026</strong><br>
            Lune : Premier Quartier en Bélier ♈<br>
            Vibration : Courage & Action | Fréquence suggérée : 528 Hz
        `;
    };
</script>

</body>
</html>
