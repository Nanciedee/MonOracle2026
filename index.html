<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Vibratoire 2026</title>
    <style>
        /* --- CSS MYSTIQUE --- */
        :root {
            --gold: #d4af37;
            --mystic-blue: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #e2e8f0;
        }

        body {
            background: radial-gradient(circle at center, #1a1a2e, #000);
            color: var(--text);
            font-family: 'Segoe UI', serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #app { width: 100%; max-width: 1100px; text-align: center; }

        h1 { color: var(--gold); letter-spacing: 4px; text-shadow: 0 0 15px var(--gold); }

        .meteo-box {
            background: var(--glass);
            border: 1px solid var(--gold);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(5px);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 15px;
            transition: 0.4s;
        }

        .card:hover { border-color: var(--gold); transform: translateY(-5px); }

        .card img { width: 100%; border-radius: 10px; height: 300px; object-fit: cover; margin-bottom: 10px; }

        .btn-main {
            background: transparent; border: 2px solid var(--gold); color: var(--gold);
            padding: 15px 30px; border-radius: 50px; cursor: pointer; font-size: 1.1rem;
            margin: 20px 0; transition: 0.3s;
        }

        .btn-main:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }

        .porte-section {
            margin-top: 40px; padding: 20px; border-top: 1px solid var(--gold);
        }

        .btn-vibration {
            background: var(--gold); border: none; padding: 10px 20px; 
            border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }

        .chakra-tag { color: var(--gold); font-weight: bold; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="app">
    <h1>ORACLE VIBRATOIRE 2026</h1>

    <div id="meteo" class="meteo-box">
        Chargement des éphémérides célestes...
    </div>

    <button class="btn-main" onclick="tirageComplet()">🔮 RECEVOIR LA GUIDANCE</button>

    <div id="display" class="cards-grid"></div>

    <div id="porte-area" class="porte-section"></div>
</div>

<script>
    // --- DATA : ARCHANGES ---
    const archanges = {
        "Michaël": { freq: "528Hz", pierres: "Lapis-lazuli", astre: "Soleil", img: "img/archanges/michael.jpg" },
        "Raphaël": { freq: "639Hz", pierres: "Malachite", astre: "Mercure", img: "img/archanges/raphael.jpg" },
        "Gabriel": { freq: "741Hz", pierres: "Pierre de lune", astre: "Lune", img: "img/archanges/gabriel.jpg" },
        "Uriel": { freq: "852Hz", pierres: "Ambre", astre: "Uranus", img: "img/archanges/uriel.jpg" },
        "Métatron": { freq: "999Hz", pierres: "Platine", astre: "Sirius", img: "img/archanges/metatron.jpg" }
    };

    // --- DATA : CHAKRAS ---
    const chakras = [
        { nom: "Racine", freq: "396Hz", msg: "Ancrage", color: "red" },
        { nom: "Plexus", freq: "528Hz", msg: "Force", color: "yellow" },
        { nom: "Cœur", freq: "639Hz", msg: "Amour", color: "green" },
        { nom: "Troisième Œil", freq: "852Hz", msg: "Intuition", color: "indigo" }
    ];

    // --- DATA : PORTES VIBRATOIRES (VOS CARTES) ---
    const portes = {
        "protection": { titre: "Protection", freq: 417, img: "img/Vibratoire Protection.png", invoc: "Je suis protégé(e)." },
        "guerison": { titre: "Guérison", freq: 528, img: "img/Vibratoire Guérison.png", invoc: "Je guéris." },
        "guidance": { titre: "Guidance", freq: 852, img: "img/Vibratoire Guide.png", invoc: "Je suis guidé(e)." },
        "amour": { titre: "Amour", freq: 639, img: "img/Vibratoire Amour.png", invoc: "Je suis Amour." },
        "sagesse": { titre: "Sagesse", freq: 963, img: "img/Vibratoire Sagesse.png", invoc: "Je sais." }
    };

    // --- AUDIO ENGINE ---
    let audioCtx = null;
    function playFreq(f) {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 4);
    }

    // --- LOGIQUE DE TIRAGE ---
    function tirageComplet() {
        const display = document.getElementById('display');
        const porteArea = document.getElementById('porte-area');
        
        // 1. Tirage Archange
        const keys = Object.keys(archanges);
        const arc = archanges[keys[Math.floor(Math.random() * keys.length)]];
        
        // 2. Tirage Chakra
        const cha = chakras[Math.floor(Math.random() * chakras.length)];

        display.innerHTML = `
            <div class="card">
                <img src="${arc.img}" onerror="this.src='https://via.placeholder.com/300x400/000/d4af37?text=Archange'">
                <h3>${arc.astre} - ${arc.freq}</h3>
                <p>Archange de guidance</p>
                <span class="chakra-tag">Pierre : ${arc.pierres}</span>
            </div>
            <div class="card">
                <div style="height:300px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); border-radius:10px;">
                    <h2 style="color:${cha.color}">${cha.nom}</h2>
                </div>
                <h3>${cha.freq}</h3>
                <p>${cha.msg}</p>
            </div>
        `;

        // 3. Tirage Porte Vibratoire (Scellement)
        const pKeys = Object.keys(portes);
        const porte = portes[pKeys[Math.floor(Math.random() * pKeys.length)]];
        
        porteArea.innerHTML = `
            <h2>Porte de Scellement</h2>
            <div class="card" style="max-width:300px; margin: 0 auto;">
                <img src="${porte.img}" onerror="this.src='https://via.placeholder.com/300x400/d4af37/000?text=Porte+Vibratoire'">
                <h3>${porte.titre}</h3>
                <p>"${porte.invoc}"</p>
                <button class="btn-vibration" onclick="playFreq(${porte.freq})">🔊 ACTIVER ${porte.freq}Hz</button>
            </div>
        `;
    }

    // --- INITIALISATION MÉTÉO ---
    window.onload = () => {
        const d = new Date();
        document.getElementById('meteo').innerHTML = `
            <strong>24 Janvier 2026</strong><br>
            Lune : Premier Quartier en Bélier ♈<br>
            Élément : Feu | Fréquence du jour : 528 Hz
        `;
    };
</script>

</body>
</html>
