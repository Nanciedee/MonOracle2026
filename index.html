        osc.frequency.setValueAtTime(f, audioCtx.currentTime);

function startAmbiance() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (ambianceOsc) return; 

        // Création d'une nappe plus riche (Basse profonde + Harmonique)
        const createDrone = (freq, vol) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle'; // Son beaucoup plus doux que 'sine'
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 3); // Montée très lente
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            return osc;
        };

                <p class="details-text">🪬 <b>Symboles :</b> ${arc.symboles}</p>
                <p class="details-text">🧭 <b>Rôle :</b> ${arc.role}</p>
                <button class="audio-btn" onclick="playFreq(${arc.freq})">🔊 ACTIVER</button>
            </div>

            <div class="fiche">
                <h3>🌀 Chakra ${cha.nom}</h3>
                <img src="${cha.img}">
                <p class="details-text">💬 <b>Mantra :</b> "${cha.mantra}"</p>
                <p class="details-text">🌈 <b>Fréquence :</b> ${cha.freq} Hz</p>
                <button class="audio-btn" onclick="playFreq(${cha.freq})">🔊 ALIGNER</button>
            </div>
            
            <div class="fiche" style="position: relative; min-height: 450px;">
                <div id="livret-overlay-box" class="livret-box" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); z-index: 10; padding: 25px; box-sizing: border-box; border-radius: 15px; border: 2px solid var(--gold); overflow-y: auto; animation: fadeIn 0.5s ease;">
                    
                    <h3 style="color:var(--gold); margin-top: 0; text-align:center; letter-spacing: 2px;">📖 GRIMOIRE DE ${vKey.toUpperCase()}</h3>
                    
                    <div class="livret-content">
                        <p style="color: #fff; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; text-align: center;">— Invocation Sacrée —</p>
                        <p id="invocation-text" style="color: var(--gold); font-style: italic; font-size: 1.1rem; line-height: 1.6; margin: 20px 0; padding: 15px; border: 1px double rgba(212, 175, 55, 0.3); background: rgba(212, 175, 55, 0.05); text-align: center;">
                            ${vib.invocation}
                        </p> 

                        <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                            <b style="color: #4CAF50;">⚡ Action Vibratoire :</b><br>
                            ${vib.effet}
                        </div>

                        <div style="padding: 5px;">
                            <b style="color: var(--gold);">🔮 Protocole de Rituel :</b><br>
                            ${vib.livret || "Infusion en cours..."}
                        </div>
                    </div>

                    <button class="audio-btn" style="background:var(--gold); color:#000; margin-top: 25px; width: 100%;" onclick="toggleLivret()">⬅ REPLIER LE LIVRET</button>
                </div>

                <h3>✨ Carte de ${vKey}</h3>
                <img src="${vib.img}" style="width: 100%; border-radius: 10px; margin-bottom: 10px;">
                <p class="details-text">🌠 <b>Astre :</b> ${vib.astre}</p>
                <p class="details-text">💎 <b>Pierres :</b> ${vib.pierres}</p>
                <p class="details-text">⚡ <b>Effet :</b> ${vib.effet}</p>
                
                <div style="margin-top: auto;">
                    <button class="audio-btn" style="background:#fff; color:#000; width: 100%;" onclick="playFreq(${vib.freq})">
                        ✨ SCELLER LE RITUEL (${vib.freq}Hz)
                    </button>
                    <button class="audio-btn" style="background:transparent; color:#fff; border:1px solid #fff; margin-top:10px; width: 100%;" onclick="toggleLivret()">
                        📖 VOIR LE LIVRET COMPLET
                    </button>
                </div>
            </div>
        `; // Fermeture du innerHTML
        
        // Remonte automatiquement en haut pour voir les cartes
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- INITIALISATION ---
    window.onload = () => {
        const phases = [
            {n: "Nouvelle Lune", i: "🌑", f: "Introspection"},
            {n: "Premier Croissant", i: "🌙", f: "Éclosion"},
            {n: "Premier Quartier", i: "🌓", f: "Action"},
            {n: "Gibbeuse Croissante", i: "🌔", f: "Affinage"},
            {n: "Pleine Lune", i: "🌕", f: "Illumination"},
            {n: "Gibbeuse Décroissante", i: "🌖", f: "Gratitude"},
            {n: "Dernier Quartier", i: "🌗", f: "Libération"},
            {n: "Dernier Croissant", i: "🌘", f: "Repos"}
        ];
        const day = new Date().getDate() % 8;
        const currentPhase = phases[day];
        
        if(document.getElementById('moon-icon')) {
            document.getElementById('moon-icon').innerText = currentPhase.i;
            document.getElementById('moon-name').innerText = currentPhase.n + " • " + currentPhase.f;
        }
        
        if(document.getElementById('moon-data')) {
            document.getElementById('moon-data').innerText = new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
        }
        // Appel de la guidance personnalisée pour Nancie
        genererGuidanceQuotidienne(currentPhase.n);
    };
</script>
</body>
</html>
