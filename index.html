<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Vibratoire 2026</title>
    <style>
        :root {
            --gold: #d4af37;
            --mystic-blue: #0f172a;
            --glass: rgba(255, 255, 255, 0.08);
            --text: #e2e8f0;
        }

        body {
            background: #000;
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- FOND ÉTOILÉ ANIMÉ --- */
        #star-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.4;
            animation: moveStar linear infinite;
        }

        @keyframes moveStar {
            from { transform: translateY(0px); }
            to { transform: translateY(-1000px); }
        }

        /* --- MISE EN PAGE --- */
        #app { width: 90%; max-width: 1200px; text-align: center; padding: 40px 0; }
        
        h1 { 
            color: var(--gold); 
            letter-spacing: 5px; 
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            margin-bottom: 20px;
        }

        .meteo-box {
            background: var(--glass);
            border: 1px solid var(--gold);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        /* --- CHAMP D'INTENTION --- */
        .intention-box {
            margin-bottom: 30px;
        }

        input[type="text"] {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--gold);
            color: white;
            padding: 15px;
            width: 80%;
            max-width: 500px;
            border-radius: 30px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px var(--gold);
            background: rgba(255,255,255,0.1);
        }

        .btn-main {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 18px 45px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.5s;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .btn-main:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 40px var(--gold);
        }

        /* --- GRILLE DE CARTES --- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 25px;
            transition: 0.4s;
            backdrop-filter: blur(5px);
        }

        .card:hover {
            border-color: var(--gold);
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-vibration {
            background: var(--gold);
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-vibration:hover { transform: scale(1.05); filter: brightness(1.2); }

        .porte-title {
            grid-column: 1 / -1;
            color: var(--gold);
            font-size: 2.2rem;
            margin-top: 60px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .intention-rappel {
            grid-column: 1 / -1;
            font-style: italic;
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div id="star-container"></div>

<div id="app">
    <h1>✨ ORACLE VIBRATOIRE 2026 ✨</h1>

    <div id="meteo" class="meteo-box">
        Chargement des fréquences planétaires...
    </div>

    <div class="intention-box">
        <input type="text" id="userIntention" placeholder="Posez votre question ou posez une intention ici...">
    </div>

    <button class="btn-main" onclick="tirageRituel()">🔮 TIRER LES CARTES</button>

    <div id="display" class="cards-grid"></div>
</div>

<script>
    // --- ÉTOILES ---
    function initStars() {
        const container = document.getElementById('star-container');
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 40 + 20) + 's';
            container.appendChild(star);
        }
    }
    initStars();

    // --- BASE DE DONNÉES COMPLÈTE ---
    const archanges = {
        "Michaël": { freq: "528Hz", pierres: "Lapis-lazuli, Sodalite", astre: "Soleil/Mars", img: "img/archanges/michael.jpg" },
        "Raphaël": { freq: "639Hz", pierres: "Malachite, Émeraude", astre: "Mercure/Vénus", img: "img/archanges/raphael.jpg" },
        "Gabriel": { freq: "741Hz", pierres: "Pierre de lune, Citrine", astre: "Lune/Neptune", img: "img/archanges/gabriel.jpg" },
        "Uriel": { freq: "852Hz", pierres: "Ambre, Pyrite", astre: "Uranus/Soleil", img: "img/archanges/uriel.jpg" },
        "Chamuel": { freq: "639Hz", pierres: "Quartz Rose", astre: "Vénus", img: "img/archanges/chamuel.jpg" },
        "Jophiel": { freq: "963Hz", pierres: "Topaze dorée", astre: "Jupiter", img: "img/archanges/jophiel.jpg" },
        "Zadkiel": { freq: "432Hz", pierres: "Améthyste", astre: "Saturne", img: "img/archanges/zadkiel.jpg" },
        "Haniel": { freq: "417Hz", pierres: "Sélénite", astre: "Lune", img: "img/archanges/haniel.jpg" },
        "Raziel": { freq: "888Hz", pierres: "Cristal de roche", astre: "Uranus", img: "img/archanges/raziel.jpg" },
        "Azraël": { freq: "396Hz", pierres: "Rose des sables", astre: "Pluton", img: "img/archanges/azrael.jpg" },
        "Sandalphon": { freq: "285Hz", pierres: "Turquoise", astre: "Terre", img: "img/archanges/sandalphon.jpg" },
        "Métatron": { freq: "999Hz", pierres: "Platine", astre: "Cosmos", img: "img/archanges/metatron.jpg" }
    };

    const chakras = [
        { nom: "Racine", freq: "396Hz", msg: "Ancrage & Sécurité", color: "#ff4d4d" },
        { nom: "Sacré", freq: "417Hz", msg: "Créativité & Émotion", color: "#ffa366" },
        { nom: "Plexus", freq: "528Hz", msg: "Force & Volonté", color: "#ffff66" },
        { nom: "Cœur", freq: "639Hz", msg: "Amour & Compassion", color: "#66ff66" },
        { nom: "Gorge", freq: "741Hz", msg: "Vérité & Expression", color: "#66ffff" },
        { nom: "3e Œil", freq: "852Hz", msg: "Intuition & Lucidité", color: "#6666ff" },
        { nom: "Couronne", freq: "963Hz", msg: "Unité & Sagesse", color: "#a366ff" }
    ];

    const portes = {
        "protection": { titre: "Protection", freq: 417, img: "img/Vibratoire Protection.png", invoc: "Je suis entouré(e) d’un cercle de lumière, nul ne peut pénétrer sans mon accord." },
        "guerison": { titre: "Guérison", freq: 528, img: "img/Vibratoire Guérison.png", invoc: "Je suis un temple vivant, et je choisis la régénération." },
        "guidance": { titre: "Guidance", freq: 852, img: "img/Vibratoire Guide.png", invoc: "Je suis prêt(e) à recevoir les signes et à suivre le chemin." },
        "amour": { titre: "Amour", freq: 639, img: "img/Vibratoire Amour.png", invoc: "Je suis amour, je suis lien, je suis unité." },
        "sagesse": { titre: "Sagesse", freq: 963, img: "img/Vibratoire Sagesse.png", invoc: "Je suis un canal vivant de vérité." }
    };

    // --- MOTEUR AUDIO ---
    let audioCtx = null;
    function playTone(freq) {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 5);
    }

    // --- FONCTION DE TIRAGE ---
    function tirageRituel() {
        const intention = document.getElementById('userIntention').value;
        const display = document.getElementById('display');
        
        // Tirage Aléatoire
        const arcKeys = Object.keys(archanges);
        const arcName = arcKeys[Math.floor(Math.random() * arcKeys.length)];
        const arc = archanges[arcName];
        
        const cha = chakras[Math.floor(Math.random() * chakras.length)];
        
        const pKeys = Object.keys(portes);
        const pKey = pKeys[Math.floor(Math.random() * pKeys.length)];
        const porte = portes[pKey];

        display.innerHTML = `
            ${intention ? `<div class="intention-rappel">Votre intention : "${intention}"</div>` : ''}

            <div class="card">
                <h3>Archange ${arcName}</h3>
                <img src="${arc.img}" onerror="this.src='https://via.placeholder.com/300x400/000/d4af37?text=${arcName}'">
                <p><strong>Astre :</strong> ${arc.astre}</p>
                <p><strong>Vibration :</strong> ${arc.freq}</p>
                <small>Pierres : ${arc.pierres}</small>
            </div>

            <div class="card">
                <h3 style="color:${cha.color}">Chakra ${cha.nom}</h3>
                <div style="height:400px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(circle, ${cha.color}44, transparent); border-radius:10px;">
                    <span style="font-size:6rem; color:${cha.color}">🌀</span>
                    <h2 style="color:white; margin:10px 0;">${cha.freq}</h2>
                </div>
                <p>${cha.msg}</p>
            </div>

            <div class="porte-title">🚪 Scellement par la Porte Vibratoire</div>

            <div class="card" style="grid-column: 1 / -1; max-width: 500px; margin: 20px auto; border: 2px solid var(--gold);">
                <h2 style="color:var(--gold)">${porte.titre}</h2>
                <img src="${porte.img}" onerror="this.src='https://via.placeholder.com/300x400/d4af37/000?text=${porte.titre}'">
                <p style="font-size:1.1rem; padding:10px;"><em>"${porte.invoc}"</em></p>
                <button class="btn-vibration" onclick="playTone(${porte.freq})">
                    🔊 ACTIVER LA FRÉQUENCE ${porte.freq}Hz
                </button>
            </div>
        `;

        window.scrollTo({ top: display.offsetTop - 50, behavior: 'smooth' });
    }

    // --- MÉTÉO AUTOMATIQUE ---
    window.onload = () => {
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const today = new Date().toLocaleDateString('fr-FR', options);
        document.getElementById('meteo').innerHTML = `
            <strong>${today}</strong><br>
            Configuration céleste 2026 : Lune en Bélier ♈<br>
            Fréquence de résonance planétaire : 528 Hz
        `;
    };
</script>

</body>
</html>
